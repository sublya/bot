# Production. Telegram and OpenRouter aren't reachable from the server directly, so the
# bot and the Bot API server share the network namespace of a tun2socks container that
# wraps all their outgoing traffic into the host's SOCKS proxy (xray on port 1080).
# Neither of them knows about the proxy.
#
# Images arrive prebuilt (docker load), nothing is built here.
# Start: cd /opt/sublya/bot && docker compose up -d

services:
  tunnel:
    image: xjasonlyu/tun2socks:v2.6.0
    container_name: sublya-tunnel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PROXY: socks5://host.docker.internal:1080
      LOGLEVEL: warn
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # the skator Caddy reaches the bot's admin panel (port 8090) here; replies to it go out
    # through the network's own route, not into the tunnel
    networks:
      - default
      - skator
    logging: &logging
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: sublya-bot-api
    restart: unless-stopped
    network_mode: service:tunnel
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?}
      TELEGRAM_LOCAL: '1'
      TELEGRAM_HTTP_IP_ADDRESS: 127.0.0.1
    volumes:
      - bot-api:/var/lib/telegram-bot-api
    depends_on:
      - tunnel
    logging: *logging

  bot:
    image: sublya-bot:latest
    container_name: sublya-bot
    restart: unless-stopped
    network_mode: service:tunnel
    env_file: .env
    environment:
      TELEGRAM_API_URL: http://127.0.0.1:8081
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # the same path as in the Bot API container, so its file paths work as is
      - bot-api:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api
    logging: *logging

volumes:
  bot-api:

networks:
  skator:
    name: skator_default
    external: true
